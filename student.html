<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>你贊成增建更多電廠嗎？｜學生端</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          keyframes: {
            popIn: {
              '0%':   { opacity: '0', transform: 'translateY(24px) scale(.92)' },
              '60%':  { opacity: '1', transform: 'translateY(-4px) scale(1.02)' },
              '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
            },
            toastIn: {
              '0%':   { opacity: '0', transform: 'translate(-50%, -16px) scale(.9)' },
              '100%': { opacity: '1', transform: 'translate(-50%, 0) scale(1)' },
            },
            breathe: {
              '0%,100%': { opacity: '.6' },
              '50%':     { opacity: '1' },
            },
            float: {
              '0%,100%': { transform: 'translateY(0) rotate(-4deg)' },
              '50%':     { transform: 'translateY(-10px) rotate(4deg)' },
            },
            bob: {
              '0%,100%': { transform: 'translateY(0)' },
              '50%':     { transform: 'translateY(-6px)' },
            },
          },
          animation: {
            'pop-in':   'popIn .7s cubic-bezier(.34,1.56,.64,1) both',
            'toast-in': 'toastIn .45s cubic-bezier(.34,1.56,.64,1) both',
            'breathe':  'breathe 2.4s ease-in-out infinite',
            'float':    'float 5s ease-in-out infinite',
            'bob':      'bob 2.6s ease-in-out infinite',
          },
        },
      },
    };
  </script>

  <style>
    body {
      font-family: 'Huninn', 'Noto Sans TC', system-ui, sans-serif;
      color: #5B4B63;
      -webkit-tap-highlight-color: transparent;
      background:
        radial-gradient(700px 500px at 10% 0%,   #FFE1E8 0%, transparent 60%),
        radial-gradient(700px 500px at 100% 20%, #DCEBFA 0%, transparent 60%),
        radial-gradient(700px 500px at 0% 80%,   #FFE7CF 0%, transparent 60%),
        radial-gradient(700px 500px at 100% 100%,#D8F0E4 0%, transparent 60%),
        #FFF7EC;
      background-attachment: fixed;
    }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image: radial-gradient(#F0D3BD 2px, transparent 2.5px);
      background-size: 30px 30px; opacity: .45;
    }

    /* ===== 動態島膠囊（上方四個） ===== */
    .s-island {
      background: #fff;
      border: 3px solid var(--accent);
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 8px 22px rgba(120, 90, 110, .15);
      transition: box-shadow .6s ease, transform .35s ease;
    }
    .s-island:active { transform: scale(.985); }
    .s-island.open { box-shadow: 0 12px 32px rgba(120, 90, 110, .2), 0 0 0 6px var(--accent-glow); }
    .s-body {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transition: grid-template-rows .65s cubic-bezier(.22, 1, .36, 1), opacity .45s ease;
    }
    .s-island.open .s-body { grid-template-rows: 1fr; opacity: 1; }
    .s-inner { overflow: hidden; min-height: 0; }
    .s-island .chev { transition: transform .5s ease; }
    .s-island.open .chev { transform: rotate(180deg); }

    /* ===== 終極投票箱：灰色膠囊 → 動態島展開 ===== */
    .vote-box {
      position: relative;
      overflow: hidden;
      margin: 0 auto;
      border: 2px solid transparent;
      transition:
        width .8s cubic-bezier(.22, 1, .36, 1),
        height .8s cubic-bezier(.22, 1, .36, 1),
        background-color .6s ease,
        border-color .6s ease,
        border-radius .8s cubic-bezier(.22, 1, .36, 1),
        box-shadow .8s ease;
    }
    .vote-box[data-state="closed"] {
      width: min(23rem, 92vw); height: 3.5rem; border-radius: 1.75rem;
      background: #E5E7EB; border-color: #D1D5DB; box-shadow: 0 6px 18px rgba(120,90,110,.15);
    }
    .vote-box[data-state="open"] {
      width: min(34rem, 94vw); height: 11.5rem; border-radius: 2.5rem;
      background: #FFFFFF; border-color: #8FD6B1;
      box-shadow: 0 14px 40px rgba(143,214,177,.55), 0 0 0 6px rgba(143,214,177,.25);
    }
    .vote-box[data-state="voted"] {
      width: min(26rem, 92vw); height: 3.5rem; border-radius: 1.75rem;
      background: #CDEFDD; border-color: #8FD6B1; box-shadow: 0 6px 20px rgba(143,214,177,.45);
    }

    .vlayer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; transition: opacity .45s ease; opacity: 0; pointer-events: none; }
    .vote-box[data-state="closed"] .layer-closed { opacity: 1; pointer-events: auto; }
    .vote-box[data-state="open"]   .layer-open   { opacity: 1; pointer-events: auto; transition-delay: .35s; }
    .vote-box[data-state="voted"]  .layer-voted  { opacity: 1; pointer-events: auto; transition-delay: .2s; }
  </style>
</head>

<body class="min-h-screen">

  <!-- 角落的可愛小圖樣 -->

    <span class="absolute text-4xl animate-float opacity-60" style="left:2%; top:55%; animation-delay:-2.2s;">🔋</span>
    <span class="absolute text-4xl animate-float opacity-60" style="right:2%; top:68%; animation-delay:-3s;">🌱</span>

  <!-- ================= 登入頁 ================= -->
  <section id="loginView" class="relative z-10 min-h-screen flex items-center justify-center px-5">
    <div class="w-full max-w-md animate-pop-in">
      <div class="text-center mb-7 flex flex-col items-center">
        <svg viewBox="0 0 140 160" class="w-24 h-28 animate-bob drop-shadow-lg" aria-hidden="true">
          <g stroke="#F5C04A" stroke-width="5" stroke-linecap="round">
            <path d="M70 6v12"/><path d="M22 28l9 8"/><path d="M118 28l-9 8"/><path d="M8 70h12"/><path d="M132 70h-12"/>
          </g>
          <circle cx="70" cy="74" r="44" fill="#FFE08A" stroke="#F5C04A" stroke-width="4"/>
          <rect x="50" y="114" width="40" height="26" rx="8" fill="#E3DBEC" stroke="#B9AECB" stroke-width="3"/>
          <path d="M55 124h30M55 132h30" stroke="#B9AECB" stroke-width="3" stroke-linecap="round"/>
          <circle cx="54" cy="70" r="5.5" fill="#4A3F55"/><circle cx="86" cy="70" r="5.5" fill="#4A3F55"/>
          <circle cx="55.8" cy="68" r="1.8" fill="#fff"/><circle cx="87.8" cy="68" r="1.8" fill="#fff"/>
          <ellipse cx="44" cy="84" rx="7" ry="4.5" fill="#F8A5B8" opacity=".85"/>

        </h1>
        <p class="mt-3 text-[#5B4B63]/65">請輸入你的資料進入課堂 ✏️</p>

      <form id="loginForm" class="bg-white border-2 border-[#F3D9C4] rounded-[2.5rem] p-7 shadow-xl shadow-orange-200/40 space-y-5" autocomplete="off">
        <label class="block">

  <!-- ================= 主畫面 ================= -->

    <div class="max-w-xl mx-auto">

      <!-- 身分列 -->
      <div class="flex items-center justify-between bg-white/90 rounded-full pl-5 pr-2 py-2 border-2 border-[#F3D9C4] shadow-md shadow-orange-200/40">
        <div class="flex items-center gap-2 min-w-0">
          <span id="connDot" class="w-2.5 h-2.5 rounded-full bg-neutral-400 shrink-0"></span>

        <button id="logoutBtn" class="rounded-full bg-[#F1ECF4] hover:bg-[#E6DDEC] active:scale-95 transition px-4 py-1.5 text-sm font-bold shrink-0">換人</button>

        <svg viewBox="0 0 140 160" class="w-14 h-16 shrink-0 animate-bob" aria-hidden="true">
          <g stroke="#F5C04A" stroke-width="6" stroke-linecap="round">
            <path d="M70 6v12"/><path d="M22 28l9 8"/><path d="M118 28l-9 8"/>

          <circle cx="70" cy="74" r="44" fill="#FFE08A" stroke="#F5C04A" stroke-width="4"/>

        </div>

      <h3 class="mt-5 mb-3 text-center text-[#5B4B63]/70 text-lg">選擇你的立場，說出你的理由 👇</h3>

    <div id="voteBox" class="vote-box" data-state="closed">

      <!-- 尚未開放：灰色膠囊（Disabled） -->

        <button id="lockedBtn" type="button" disabled
                class="w-full h-full text-[#8C8497] font-bold text-base cursor-not-allowed">
          投票尚未開放，請聽從老師指示

        <div class="grid grid-cols-2 gap-4 w-full">
          <button id="voteAgree" type="button" disabled
                  class="rounded-full bg-[#8FD6B1] text-[#3F3447] font-black text-2xl py-4 shadow-md shadow-emerald-300/50 active:scale-95 hover:brightness-105 transition disabled:opacity-50">

          <button id="voteDisagree" type="button" disabled

<script>
/* =====================================================================
 * 設定區：請填入你的 Supabase 專案資訊
 * ===================================================================== */
const SUPABASE_URL = 'https://qtabbosbrdoblhecssrd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_xBePEbyZJ7gGhbONOuAizg_mWMH2X-t';

/* ===================================================================== */
const CONFIGURED = !SUPABASE_URL.includes('請替換') && !SUPABASE_KEY.includes('請替換');
const db = CONFIGURED ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const $ = (id) => document.getElementById(id);

const ISLANDS = [
  { key: '非常贊成',   emoji: '🥰', accent: '#7CCBA2', ink: '#2F8F63', hint: '我非常同意，因為……' },
  { key: '大部分贊成', emoji: '🙂', accent: '#7DB7E8', ink: '#2E78B5', hint: '我大致同意，不過……' },
  { key: '大部分反對', emoji: '🤔', accent: '#F5A25D', ink: '#B8620F', hint: '我大致反對，因為……' },
  { key: '非常反對',   emoji: '😤', accent: '#EF8FA6', ink: '#C2506B', hint: '我強烈反對，因為……' },
];

/* ---------- 狀態 ---------- */
let me = null;              // { cls, seat, name }
let votingOpen = false;
let myVote = null;          // '贊成' | '反對' | null
let statusChannel = null;
let pollTimer = null;
let sending = false;

/* ---------- 小工具 ---------- */
function toast(msg, ms = 2400) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.remove('hidden', 'animate-toast-in');
  void t.offsetWidth;
  t.classList.add('animate-toast-in');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.add('hidden'), ms);
}

function setConn(state) {
  const dot = $('connDot');
  dot.className = 'w-2.5 h-2.5 rounded-full shrink-0';
  if (state === 'ok')       dot.classList.add('bg-emerald-400', 'animate-breathe');
  else if (state === 'err') dot.classList.add('bg-rose-400');
  else                      dot.classList.add('bg-neutral-400');
}

const voteKey = () => `debate_voted:${me.cls}:${me.seat}`;

/* ---------- 登入 ---------- */
function fillClassList() {
  const grades = ['一', '二', '三', '四', '五', '六'];
  const nums = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
  const opts = [];
  grades.forEach((g) => nums.forEach((n) => opts.push(`${g}年${n}班`)));
  $('classList').innerHTML = opts.map((o) => `<option value="${o}"></option>`).join('');
}

$('loginForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const cls = $('inClass').value.trim();
  const seat = parseInt($('inSeat').value, 10);
  const name = $('inName').value.trim();
  if (!cls || !name || !Number.isInteger(seat) || seat < 1) { toast('請完整填寫班級、座號、姓名'); return; }
  me = { cls, seat, name };
  localStorage.setItem('debate_student', JSON.stringify(me));
  enterMain();
});

$('logoutBtn').addEventListener('click', () => {
  if (statusChannel && db) db.removeChannel(statusChannel);
  statusChannel = null;
  clearInterval(pollTimer);
  localStorage.removeItem('debate_student');
  me = null; myVote = null; votingOpen = false;
  $('mainView').classList.add('hidden');
  $('voteDock').classList.add('hidden');
  $('loginView').classList.remove('hidden');
  setConn('off');
});

/* ---------- 四個動態島 ---------- */
function buildIslands() {
  const host = $('islandList');
  host.innerHTML = '';
  ISLANDS.forEach((isl, idx) => {
    const el = document.createElement('div');
    el.className = 's-island animate-pop-in';
    el.style.animationDelay = (idx * 90) + 'ms';
    el.dataset.key = isl.key;
    el.style.setProperty('--accent', isl.accent);
    el.style.setProperty('--accent-glow', isl.accent + '55');

    el.innerHTML = `
      <button type="button" class="head w-full h-16 flex items-center gap-4 px-5 text-left">
        <span class="text-3xl leading-none">${isl.emoji}</span>
        <span class="font-black text-2xl" style="color:${isl.ink}">${isl.key}</span>
        <svg class="chev ml-auto w-6 h-6 text-[#5B4B63]/50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="s-body">
        <div class="s-inner">
          <div class="px-5 pb-5 pt-1">
            <textarea rows="3" maxlength="120" placeholder="${isl.hint}"
              class="w-full resize-none rounded-3xl bg-[#FFF7EC] px-5 py-4 text-lg outline-none border-2 transition placeholder-[#5B4B63]/30"
              style="border-color:${isl.accent}88; color:#4A3F55"></textarea>
            <div class="mt-3 flex items-center justify-between">
              <span class="counter text-[#5B4B63]/45 text-sm tabular-nums">0 / 120</span>
              <div class="flex gap-2">
                <button type="button" class="cancel rounded-full bg-[#F1ECF4] hover:bg-[#E6DDEC] active:scale-95 transition px-5 py-2.5 font-bold">取消</button>
                <button type="button" class="send rounded-full px-7 py-2.5 font-black text-[#3F3447] shadow-md active:scale-95 hover:brightness-105 transition disabled:opacity-50"
                        style="background:${isl.accent}">送出理由</button>
              </div>
            </div>
          </div>
        </div>
      </div>`;

    const ta = el.querySelector('textarea');
    const counter = el.querySelector('.counter');
    ta.addEventListener('input', () => { counter.textContent = `${ta.value.length} / 120`; });

    el.querySelector('.head').addEventListener('click', () => toggleIsland(el));
    el.querySelector('.cancel').addEventListener('click', () => el.classList.remove('open'));
    el.querySelector('.send').addEventListener('click', () => submitReason(isl, el));

    host.appendChild(el);
  });
}

function toggleIsland(el) {
  const willOpen = !el.classList.contains('open');
  document.querySelectorAll('.s-island').forEach((x) => x.classList.remove('open'));
  if (willOpen) {
    el.classList.add('open');
    setTimeout(() => el.querySelector('textarea').focus({ preventScroll: true }), 450);
    setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 300);
  }
}

async function submitReason(isl, el) {
  if (sending) return;
  const ta = el.querySelector('textarea');
  const btn = el.querySelector('.send');
  const reason = ta.value.trim();
  if (!reason) { toast('請先輸入理由'); ta.focus(); return; }
  if (!db) { toast('尚未設定 Supabase'); return; }

  sending = true;
  btn.disabled = true;
  btn.textContent = '送出中…';

  const { error } = await db.from('arguments').insert({
    class_name: me.cls,
    seat: me.seat,
    name: me.name,
    island: isl.key,
    reason,
  });

  sending = false;
  btn.disabled = false;
  btn.textContent = '送出理由';

  if (error) { toast('送出失敗：' + error.message, 3600); return; }

  ta.value = '';
  el.querySelector('.counter').textContent = '0 / 120';
  el.classList.remove('open');
  toast(`✅ 已送出到「${isl.key}」`);
}

/* ---------- 終極投票箱 ---------- */
function applyVoteState() {
  const box = $('voteBox');
  const state = myVote ? 'voted' : (votingOpen ? 'open' : 'closed');
  box.dataset.state = state;

  const canVote = state === 'open';
  $('voteAgree').disabled = !canVote;
  $('voteDisagree').disabled = !canVote;
  $('lockedBtn').disabled = true; // 永遠不可點

  if (state === 'voted') {
    $('votedText').textContent = `✓ 你已投下「${myVote}」，感謝參與`;
  }
}

function setVotingOpen(v) {
  const changed = votingOpen !== v;
  votingOpen = v;
  applyVoteState();
  if (changed && v && !myVote) toast('🗳️ 終極投票開放了！', 2800);
}

async function castVote(choice) {
  if (myVote || !votingOpen || !db) return;
  $('voteAgree').disabled = true;
  $('voteDisagree').disabled = true;

  const { error } = await db.from('votes').insert({
    class_name: me.cls, seat: me.seat, name: me.name, choice,
  });

  if (error) {
    if (error.code === '23505') {            // 已投過（唯一鍵衝突）
      await checkExistingVote();
      applyVoteState();
      toast('你已經投過票了');
      return;
    }
    applyVoteState();
    toast('投票失敗：' + error.message, 3600);
    return;
  }

  myVote = choice;
  try { localStorage.setItem(voteKey(), choice); } catch (_) {}
  applyVoteState();
}

$('voteAgree').addEventListener('click', () => castVote('贊成'));
$('voteDisagree').addEventListener('click', () => castVote('反對'));

async function checkExistingVote() {
  let local = null;
  try { local = localStorage.getItem(voteKey()); } catch (_) {}
  myVote = local || null;
  if (!db) return;
  const { data } = await db.from('votes').select('choice')
    .eq('class_name', me.cls).eq('seat', me.seat).maybeSingle();
  if (data && data.choice) myVote = data.choice;
}

async function fetchStatus() {
  if (!db || !me) return;
  const { data, error } = await db.from('system_status').select('voting_open')
    .eq('class_name', me.cls).maybeSingle();
  if (!error) setVotingOpen(!!(data && data.voting_open));
}

function subscribeStatus() {
  if (!db) return;
  if (statusChannel) db.removeChannel(statusChannel);
  const cls = me.cls;

  statusChannel = db.channel('student-' + Date.now())
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'system_status', filter: `class_name=eq.${cls}` },
      (p) => {
        const row = p.new;
        if (row && row.class_name === me.cls) setVotingOpen(!!row.voting_open);
      })
    .subscribe((status) => {
      if (status === 'SUBSCRIBED') { setConn('ok'); fetchStatus(); }
      else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') setConn('err');
      else if (status === 'CLOSED') setConn('off');
    });

  // 保險機制：平板休眠或網路中斷後，定期補抓狀態
  clearInterval(pollTimer);
  pollTimer = setInterval(fetchStatus, 8000);
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && me) fetchStatus();
});

/* ---------- 進入主畫面 ---------- */
async function enterMain() {
  $('loginView').classList.add('hidden');
  $('mainView').classList.remove('hidden');
  $('voteDock').classList.remove('hidden');
  $('meLabel').textContent = `${me.cls}　${me.seat} 號　${me.name}`;

  buildIslands();
  votingOpen = false;
  myVote = null;
  applyVoteState();

  if (!db) return;
  await checkExistingVote();
  applyVoteState();
  await fetchStatus();
  subscribeStatus();
}

/* ---------- 初始化 ---------- */
function init() {
  fillClassList();
  if (!CONFIGURED) $('configWarn').classList.remove('hidden');

  try {
    const saved = JSON.parse(localStorage.getItem('debate_student') || 'null');
    if (saved && saved.cls && saved.seat && saved.name) {
      me = saved;
      enterMain();
      return;
    }
  } catch (_) {}
  applyVoteState();
}

init();
</script>
